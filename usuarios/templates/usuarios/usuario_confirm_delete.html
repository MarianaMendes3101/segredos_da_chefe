{% extends 'base.html' %}
{% block title %}Excluir usuário | Segredos da Chef{% endblock %}
{% block content %}<section class="panel"><h1>Excluir usuário</h1><p>Tem certeza de que deseja excluir a conta <strong>{{ usuario.username }}</strong>?</p><form method="post">{% csrf_token %}<div class="form-actions"><button class="btn danger" type="submit">Sim, excluir</button><a class="btn secondary" href="{% url 'usuarios:lista' %}">Cancelar</a></div></form></section>{% endblock %}
