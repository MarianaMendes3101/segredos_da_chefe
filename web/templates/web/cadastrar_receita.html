{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Receita</title>
    <!-- Conexão com os arquivos CSS existentes -->
    <link rel="stylesheet" href="{% static 'css/layout.css' %}">
    <link rel="stylesheet" href="{% static 'css/form.css' %}">
    <link rel="stylesheet" href="{% static 'css/receita.css' %}">
</head>
<body>
    <header>
        <a class="logo" href="{% url 'web:index' %}">
            <div class="logo-texto">Segredos da <span>Chef</span></div>
        </a>
    </header>

    <main>
        <section class="banner">
            <div class="banner-texto">
                <h1>Cadastrar Nova Receita</h1>

                <!-- O formulário precisa do method="POST" e do csrf_token -->
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}

                    <!-- Se você estiver usando um Django Form/ModelForm, use {{ form.as_p }} -->
                    {{ form.as_p }}

                    <input type="submit" value="Salvar Receita">
                </form>
            </div>
        </section>
    </main>
</body>
</html>
