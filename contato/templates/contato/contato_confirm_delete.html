{% extends 'base.html' %}
{% block title %}Excluir mensagem | Segredos da Chef{% endblock %}
{% block content %}<section class="panel"><h1>Excluir mensagem</h1><p>Deseja excluir a mensagem enviada por <strong>{{ contato.nome }}</strong>?</p><blockquote>{{ contato.mensagem }}</blockquote><form method="post">{% csrf_token %}<div class="form-actions"><button class="btn danger" type="submit">Sim, excluir</button><a class="btn secondary" href="{% url 'contato:lista' %}">Cancelar</a></div></form></section>{% endblock %}
